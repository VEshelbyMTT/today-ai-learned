<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.asset_version }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Today AI Learned home">
        <span class="site-mark__brace" aria-hidden="true">{ }</span>
        <span>Today AI Learned</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/#articles' | relative_url }}">Articles</a>
        <a href="{{ '/#examples' | relative_url }}">Examples</a>
        <a href="{{ '/request/' | relative_url }}">Request a topic</a>
        <a class="site-nav__github" href="https://github.com/VEshelbyMTT/today-ai-learned" target="_blank" rel="noopener noreferrer" aria-label="View Today AI Learned on GitHub" title="View source and examples on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.3c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A12 12 0 0 0 12 .3Z"/>
          </svg>
        </a>
      </nav>
    </header>

    <main{% if page.home %} class="home"{% else %} class="prose"{% endif %}>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Written by VE. Edited by AI. Edited again by VE. AI disagreed. VE called shotgun and won anyway.</p>
    </footer>
  </body>
</html>
