name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install layout test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit layout test dependencies
        run: npm audit --audit-level=high --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start site preview
        run: |
          mkdir -p _preview/today-ai-learned
          cp -a _site/. _preview/today-ai-learned/
          python3 -m http.server 4000 --directory _preview > /tmp/today-ai-learned-preview.log 2>&1 &
      - name: Check article layout
        run: npm run check:layout
        env:
          SITE_PREVIEW_URL: http://127.0.0.1:4000/today-ai-learned
      - name: Upload layout screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: article-layout-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
