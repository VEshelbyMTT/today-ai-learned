<svg xmlns="http://www.w3.org/2000/svg" width="677" height="433" viewBox="0 0 677 433" role="img" aria-labelledby="title description">
  <title id="title">Today AI Learned Series</title>
  <desc id="description">Cream grid banner with bold black Today AI Learned typography and a cyan code block.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1e2a24" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="677" height="433" fill="#f4f1e8"/>
  <rect width="677" height="433" fill="url(#grid)"/>
  <rect width="24" height="433" fill="#c8f135"/>
  <rect x="24" width="7" height="433" fill="#111713"/>
  <line x1="66" y1="10" x2="642" y2="10" stroke="#111713" stroke-width="6"/>

  <g transform="translate(32 0)" aria-label="Series title">
    <text x="28" y="107" fill="#111713" font-family="Arial Black, Trebuchet MS, sans-serif" font-size="108" font-weight="900" letter-spacing="0">TODAY</text>
    <text x="28" y="237" fill="#111713" font-family="Arial Black, Trebuchet MS, sans-serif" font-size="145" font-weight="900" letter-spacing="0">AI</text>
    <rect x="213" y="137" width="242" height="110" fill="#25b4c5"/>
    <text x="241" y="224" fill="#111713" font-family="Consolas, monospace" font-size="72" font-weight="700" letter-spacing="0">{ }</text>
    <text x="28" y="365" fill="#111713" font-family="Arial Black, Trebuchet MS, sans-serif" font-size="109" font-weight="900" letter-spacing="0">LEARNED</text>
  </g>
  <text x="522" y="407" fill="#8c918d" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0">Victoria Eshelby</text>
  <line x1="66" y1="423" x2="642" y2="423" stroke="#111713" stroke-width="6"/>
</svg>
